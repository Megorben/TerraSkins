name: API probe

on:
  push:
    paths:
      - 'tools/probe/**'
      - '.github/workflows/api-probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Decompile requested members
        run: |
          curl -fsSL -o tml.zip "https://github.com/tModLoader/tModLoader/releases/download/v2026.08.3.0/tModLoader.zip"
          unzip -q tml.zip -d tml
          dotnet tool install -g ilspycmd > /dev/null
          export PATH="$PATH:$HOME/.dotnet/tools"
          python3 tools/probe/probe.py tml/tModLoader.dll tools/probe/queries.txt
