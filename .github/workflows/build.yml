name: Build mod

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      tml_version:
        description: tModLoader release tag to build against
        required: false
        default: v2026.08.3.0

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TML_VERSION: ${{ github.event.inputs.tml_version || 'v2026.08.3.0' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: ModSources/TerraSkins

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Download tModLoader ${{ env.TML_VERSION }}
        run: |
          curl -fsSL -o tModLoader.zip "https://github.com/tModLoader/tModLoader/releases/download/${TML_VERSION}/tModLoader.zip"
          unzip -q tModLoader.zip -d tModLoader
          # Packaging converts PNGs with FNA3D, which needs tModLoader's bundled native libraries.
          NATIVE="$(dirname "$(find "$GITHUB_WORKSPACE/tModLoader" -name 'libFNA3D.so*' | head -1)")"
          echo "Native libraries: $NATIVE"
          ls "$NATIVE"
          echo "LD_LIBRARY_PATH=$NATIVE" >> "$GITHUB_ENV"

      - name: Create ModSources/tModLoader.targets
        run: |
          cat > ModSources/tModLoader.targets <<EOF
          <Project ToolsVersion="14.0" xmlns="http://schemas.microsoft.com/developer/msbuild/2003">
            <Import Project="${GITHUB_WORKSPACE}/tModLoader/tMLMod.targets" />
          </Project>
          EOF

      - name: Build
        working-directory: ModSources/TerraSkins
        run: dotnet build -c Release --nologo

      - name: Collect .tmod
        run: |
          mkdir -p dist
          find "$HOME" -name "TerraSkins.tmod" -exec cp {} dist/ \;
          ls -la dist
          test -f dist/TerraSkins.tmod

      - name: Smoke test (load the mod on a dedicated server)
        run: |
          MODS_DIR="$(dirname "$(find "$HOME" -name TerraSkins.tmod | head -1)")"
          echo '["TerraSkins"]' > "$MODS_DIR/enabled.json"
          cd tModLoader
          timeout 300 dotnet tModLoader.dll -server -autocreate 1 -worldname Smoke -world "$RUNNER_TEMP/Smoke.wld" -maxplayers 2 -port 7779 < /dev/null > "$RUNNER_TEMP/server.out" 2>&1 || true
          LOG="$(find "$HOME" -name server.log | head -1)"
          echo "---- server output (tail)"; tail -40 "$RUNNER_TEMP/server.out"
          echo "---- server.log (tail)"; tail -80 "$LOG"
          if grep -qiE "TerraSkins.*(exception|error)|(exception|error).*TerraSkins" "$LOG"; then
            echo "TerraSkins failed to load"; exit 1
          fi
          grep -q "Server started" "$RUNNER_TEMP/server.out" || grep -qi "listening on port" "$RUNNER_TEMP/server.out"

      - name: Upload .tmod
        uses: actions/upload-artifact@v4
        with:
          name: TerraSkins-tmod
          path: dist/TerraSkins.tmod
